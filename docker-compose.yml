
services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/fleet_management
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT: http://minio:9000
    depends_on:
      - mongo
      - minio

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: fleettrack-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000
      $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        sleep 2;
      done;
      mc mb --ignore-existing local/fleettrack-documents;
      mc anonymous set none local/fleettrack-documents;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    restart: "no"

volumes:
  mongo_data:
  minio_data:
